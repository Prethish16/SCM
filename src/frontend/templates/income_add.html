{% extends "base.html" %}
{% block title %}Add Income - Expense Tracker{% endblock %}
{% block content %}
<div class="form-card card">
  <h1>Add Income</h1>
  <form method="post">
    <label for="amount">Amount</label>
    <input type="number" step="0.01" min="0.01" id="amount" name="amount"
           value="{{ form.amount or '' }}" required>

    <label for="source">Source</label>
    <input type="text" id="source" name="source" placeholder="e.g. Salary, Freelance"
           value="{{ form.source or '' }}" required>

    <label for="date">Date</label>
    <input type="date" id="date" name="date" value="{{ form.date or '' }}" required>

    <button type="submit" class="btn btn-primary">Add income</button>
  </form>
</div>
{% endblock %}
