{% extends "base.html" %}
{% block title %}Login - Expense Tracker{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Welcome back</h1>
  <p class="muted">Log in to track your income and expenses.</p>
  <form method="post">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
  <p class="muted">No account yet? <a href="{{ url_for('auth.register') }}">Register</a></p>
</div>
{% endblock %}
