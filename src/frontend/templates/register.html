{% extends "base.html" %}
{% block title %}Register - Expense Tracker{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create your account</h1>
  <p class="muted">Start recording your income and expenses in minutes.</p>
  <form method="post">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ name or '' }}" required autofocus>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" required>

    <label for="password">Password <span class="muted">(min 6 characters)</span></label>
    <input type="password" id="password" name="password" minlength="6" required>

    <button type="submit" class="btn btn-primary">Register</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
